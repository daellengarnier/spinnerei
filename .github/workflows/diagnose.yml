# Diagnose: vergangene Events auf kulturspinnerei.ch anschauen —
# Beschreibung/Formatierung/Links, damit der Publish sie nachbildet.
name: Diagnose VPS

on:
  workflow_dispatch:
  push:
    branches: [diagnose]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Vergangene Events inspizieren
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -uo pipefail
            BASE=https://kulturspinnerei.ch
            CURL="docker run --rm curlimages/curl:8.10.1 -sS -L --max-time 20"
            echo "=== Vergangene Events (Liste) ==="
            $CURL "$BASE/wp-json/tribe/events/v1/events?start_date=2024-01-01&end_date=2026-08-04&per_page=4&_fields=id,title,url,website,cost,start_date,end_date" | head -c 2500 || true; echo
            echo "=== Detail des neuesten vergangenen Events ==="
            ID=$($CURL "$BASE/wp-json/tribe/events/v1/events?start_date=2024-01-01&end_date=2026-08-04&per_page=50" | tr ',' '\n' | grep -oE '"id":[0-9]+' | tail -1 | grep -oE '[0-9]+')
            echo "Event-ID: ${ID:-keine gefunden}"
            if [ -n "${ID:-}" ]; then
              $CURL "$BASE/wp-json/tribe/events/v1/events/$ID" | head -c 6000 || true; echo
            fi
