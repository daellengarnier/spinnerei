# Diagnose: Petzi-Webhook-Doku laden + Stand der petzi_tickets-Tabelle prüfen.
name: Diagnose VPS

on:
  workflow_dispatch:
  push:
    branches: [diagnose]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Petzi-Doku + Ticket-Tabelle
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -uo pipefail
            CURL="docker run --rm curlimages/curl:8.10.1 -sS -L --max-time 20"
            echo "=== Petzi-Webhook-Doku (Text) ==="
            $CURL "https://www.petzi.ch/en/member-center/docs/webhooks/" \
              | sed -e 's/<script[^>]*>[^<]*<\/script>//g' -e 's/<style[^>]*>[^<]*<\/style>//g' -e 's/<[^>]*>/ /g' \
              | tr -s ' \n' ' \n' | grep -vE '^\s*$' | head -c 9000 || true
            echo
            echo "=== petzi_tickets: Anzahl & letzte Einträge ==="
            docker exec spinnerei-db psql -U spinnerei -d spinnerei -c 'SELECT COUNT(*) AS total, COUNT(*) FILTER (WHERE storniert) AS storniert FROM petzi_tickets;' 2>&1 || true
            docker exec spinnerei-db psql -U spinnerei -d spinnerei -c 'SELECT "ticketNumber", "eventId", "eventTitel", kategorie, storniert, "createdAt" FROM petzi_tickets ORDER BY id DESC LIMIT 5;' 2>&1 || true
            echo "=== App-Logs: petzi ==="
            docker logs --since 4h spinnerei-app 2>&1 | grep -i petzi | tail -20 || echo "(keine petzi-Einträge in den Logs)"
