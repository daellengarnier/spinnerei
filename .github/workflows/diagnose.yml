# Einmalig: Jarvis zum Admin machen, danach Kontrolle (nur Name/Rolle).
name: Diagnose VPS

on:
  workflow_dispatch:
  push:
    branches: [diagnose]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Jarvis zum Admin machen
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -uo pipefail
            docker exec spinnerei-db psql -U spinnerei -d spinnerei -c "UPDATE users SET rolle = 'admin' WHERE name = 'Jarvis';"
            echo "=== Kontrolle ==="
            docker exec spinnerei-db psql -U spinnerei -d spinnerei -c "SELECT name, rolle, claimed FROM users WHERE name = 'Jarvis';"
