# Diagnose: prüfen ob die WordPress-Variablen im App-Container angekommen
# sind (nur ja/nein, keine Werte in den Logs).
name: Diagnose VPS

on:
  workflow_dispatch:
  push:
    branches: [diagnose]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: WP-Env-Check via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -uo pipefail
            docker exec spinnerei-app sh -c 'test -n "$WP_URL" && echo "WP_URL: gesetzt" || echo "WP_URL: FEHLT"'
            docker exec spinnerei-app sh -c 'test -n "$WP_USER" && echo "WP_USER: gesetzt" || echo "WP_USER: FEHLT"'
            docker exec spinnerei-app sh -c 'test -n "$WP_APP_PASSWORD" && echo "WP_APP_PASSWORD: gesetzt" || echo "WP_APP_PASSWORD: FEHLT"'
