# Diagnose: kommende Anlässe mit Eckdaten auslesen (für Saison-Mail).
name: Diagnose VPS

on:
  workflow_dispatch:
  push:
    branches: [diagnose]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Anlässe auslesen via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -uo pipefail
            echo "=== Kommende Anlässe ==="
            docker exec spinnerei-db psql -U spinnerei -d spinnerei -c "SELECT datum, name, art, zugang, tueroeffnung, ende FROM anlaesse WHERE datum >= to_char(now(), 'YYYY-MM-DD') ORDER BY datum;"
