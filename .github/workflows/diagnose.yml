# Einmalig: VAPID-Schlüssel für Web-Push auf dem VPS einrichten.
# Schlüssel werden auf dem VPS generiert und landen NIE in den Logs.
name: Diagnose VPS

on:
  workflow_dispatch:
  push:
    branches: [diagnose]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: VAPID einrichten via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/spinnerei
            if grep -q VAPID_PUBLIC_KEY .env 2>/dev/null; then
              echo "VAPID bereits konfiguriert."
            else
              KEYS=$(docker run --rm node:22-alpine sh -c "npm i -g web-push@3.6.7 >/dev/null 2>&1 && node -e \"const wp=require('/usr/local/lib/node_modules/web-push');const k=wp.generateVAPIDKeys();console.log('VAPID_PUBLIC_KEY='+k.publicKey);console.log('VAPID_PRIVATE_KEY='+k.privateKey);\"")
              printf '%s\n' "$KEYS" >> .env
              echo "VAPID_SUBJECT=mailto:orga@spinnerei.al-daellen.ch" >> .env
              echo "VAPID-Schlüssel generiert und in .env abgelegt."
            fi
            if ! grep -q VAPID_PUBLIC_KEY docker-compose.yml; then
              sed -i 's|^\(      DATABASE_URL: .*\)$|\1\n      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}\n      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}\n      VAPID_SUBJECT: ${VAPID_SUBJECT:-}|' docker-compose.yml
              echo "docker-compose.yml um VAPID-Variablen ergänzt."
            fi
            docker compose up -d
            sleep 5
            docker exec spinnerei-app sh -c 'test -n "$VAPID_PUBLIC_KEY" && echo "App hat VAPID_PUBLIC_KEY: ja" || echo "App hat VAPID_PUBLIC_KEY: NEIN"'
