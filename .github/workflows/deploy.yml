name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: WP_URL,WP_USER,WP_APP_PASSWORD
          script: |
            set -euo pipefail
            cd /opt/spinnerei
            # WordPress-Zugang (kulturspinnerei.ch) in .env nachführen — Werte
            # kommen aus GitHub-Secrets und werden in den Logs maskiert.
            if [ -n "${WP_APP_PASSWORD:-}" ]; then
              grep -vE '^WP_(URL|USER|APP_PASSWORD)=' .env > .env.tmp || true
              printf 'WP_URL=%s\nWP_USER=%s\nWP_APP_PASSWORD=%s\n' "$WP_URL" "$WP_USER" "$WP_APP_PASSWORD" >> .env.tmp
              mv .env.tmp .env
            fi
            if ! grep -q WP_APP_PASSWORD docker-compose.yml; then
              sed -i 's|^\(      VAPID_SUBJECT: .*\)$|\1\n      WP_URL: ${WP_URL:-}\n      WP_USER: ${WP_USER:-}\n      WP_APP_PASSWORD: ${WP_APP_PASSWORD:-}|' docker-compose.yml
              echo "docker-compose.yml um WordPress-Variablen ergänzt."
            fi
            docker compose pull
            docker compose up -d
            docker image prune -f
            echo "Deployed at $(date -Iseconds)"
            docker compose ps
